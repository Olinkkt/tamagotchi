[package]
name = "tamagotchi"
version = "1.9.0"
edition = "2024"
rust-version = "1.86"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
macroquad = { version = "=0.4.16", default-features = false }
png = "=0.17.16"
# Not used directly: holds macroquad's font crate at a release that builds on stable Rust 1.86
# (0.9.5 needs 1.87). `cargo install` ignores Cargo.lock, so the pin has to live here.
fontdue = "=0.9.3"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "tama"
path = "src/main.rs"

[workspace]
members = [".", "tools/spritegen"]
