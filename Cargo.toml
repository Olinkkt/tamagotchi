[package]
name = "tamagotchi"
version = "0.9.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossterm = "0.29.0"
dirs = "7.0.0"
ratatui = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "tama"
path = "src/main.rs"
